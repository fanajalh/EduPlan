name: Build Android APK (Gradle)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 📥 Install Dependencies
        run: npm ci

      - name: 🛠️ Generate Android Native Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Build APK with Gradle
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduPlan-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: 🚀 Create GitHub Release with APK
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: EduPlaner v1.0.0 (Build #${{ github.run_number }})
          body: |
            ## 🎉 EduPlaner Android APK Siap Diinstal!
            
            Silakan unduh file `app-debug.apk` di bawah ini langsung ke HP Android Anda dan pasang (install).
            
            - **Commit:** `${{ github.sha }}`
            - **Build System:** Gradle (Temurin JDK 17, Expo SDK 57)
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
